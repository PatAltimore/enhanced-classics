# Output path relative to book_generator/
output_dir: "../public/books"

# ---------------------------------------------------------------------------
# Model chain — tried in order; first success wins.
# Name must match a key in client.py's _ENDPOINT_MAP.
# ---------------------------------------------------------------------------
models:
  primary: "gpt-4o"
  fallback:
    - "gpt-5.6-luna"
    - "o4-mini"

# ---------------------------------------------------------------------------
# Generation parameters
# ---------------------------------------------------------------------------
generation:
  temperature: 0.7
  max_tokens: 8192
  chapter_target_words: 2500   # prose target; enhancements pass uses its own max_tokens

# ---------------------------------------------------------------------------
# Books to generate.
#
# - slug:        matches the folder name under public/books/
# - chapters:    only chapters listed here will be generated; already-existing
#                files are skipped automatically (use --force to override)
# ---------------------------------------------------------------------------
books:

  - slug: "walden"
    title: "Walden"
    author: "Henry David Thoreau"
    year: 1854
    # Gutenberg ID 205.  Chapter headings are plain Title Case on their own line
    # ("Economy", "Reading", etc.) with no leading indent — TOC entries have a
    # leading space so the title-based split skips them automatically.
    gutenberg_id: 205
    gutenberg_split: title     # match chapter titles from books.yaml directly
    gutenberg_heading_lines: 1 # strip just the title line itself
    description: >
      Thoreau's account of two years living alone in a cabin near Walden Pond,
      exploring themes of self-reliance, deliberate living, and humanity's
      relationship with nature.
    chapters:
      - number: 1
        title: "Economy"
        slug: "chapter-01-economy"
      - number: 2
        title: "Where I Lived, and What I Lived For"
        slug: "chapter-02-where-i-lived"
      - number: 3
        title: "Reading"
        slug: "chapter-03-reading"
      - number: 4
        title: "Sounds"
        slug: "chapter-04-sounds"
      - number: 5
        title: "Solitude"
        slug: "chapter-05-solitude"
